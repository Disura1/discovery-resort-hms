server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend service (adjust the upstream
    # name/port to match your deployment, e.g. the "backend" service in
    # docker-compose.yml or an internal load balancer address in production).
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app fallback: any unknown path serves index.html so
    # client-side routing (React Router) can take over.
    location / {
        try_files $uri /index.html;
    }

    # Cache hashed static assets aggressively; index.html is never cached.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
